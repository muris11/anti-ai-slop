<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="anti-ai-slop severity tiers P0 to P6">
  <rect width="960" height="560" rx="24" fill="#F4EFE6"/>
  <text x="48" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#16140F" letter-spacing="1">SEVERITY TIERS</text>
  <text x="48" y="96" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#5A5648">How strong a signal each indicator is — P0 is the loudest.</text>

  <!-- P0 -->
  <g>
    <text x="48" y="150" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#16140F">P0</text>
    <rect x="112" y="130" width="120" height="28" rx="6" fill="#E94E24"/>
    <rect x="248" y="130" width="220" height="28" rx="6" fill="#E94E24"/>
    <text x="290" y="149" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F4EFE6">INSTANT TELL</text>
    <text x="490" y="149" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#16140F">the single strongest AI-made signal</text>
  </g>

  <!-- P1 -->
  <g>
    <text x="48" y="198" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#16140F">P1</text>
    <rect x="112" y="178" width="92" height="28" rx="6" fill="#E96A2A"/>
    <rect x="220" y="178" width="200" height="28" rx="6" fill="#E96A2A"/>
    <text x="262" y="197" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F4EFE6">STRONG TELL</text>
    <text x="442" y="197" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#16140F">loud alone, usually wrong</text>
  </g>

  <!-- P2 -->
  <g>
    <text x="48" y="246" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#16140F">P2</text>
    <rect x="112" y="226" width="70" height="28" rx="6" fill="#E8A23B"/>
    <rect x="198" y="226" width="196" height="28" rx="6" fill="#E8A23B"/>
    <text x="240" y="245" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F4EFE6">SUSPICIOUS</text>
    <text x="416" y="245" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#16140F">common AI default, may be earned</text>
  </g>

  <!-- P3 -->
  <g>
    <text x="48" y="294" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#16140F">P3</text>
    <rect x="112" y="274" width="58" height="28" rx="6" fill="#B7B26B"/>
    <rect x="186" y="274" width="190" height="28" rx="6" fill="#B7B26B"/>
    <text x="228" y="293" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F4EFE6">CONTEXT</text>
    <text x="398" y="293" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#16140F">slop only in the wrong context</text>
  </g>

  <!-- P4 -->
  <g>
    <text x="48" y="342" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#16140F">P4</text>
    <rect x="112" y="322" width="60" height="28" rx="6" fill="#7E93A8"/>
    <rect x="188" y="322" width="196" height="28" rx="6" fill="#7E93A8"/>
    <text x="230" y="341" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F4EFE6">QUALITY / UX</text>
    <text x="406" y="341" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#16140F">shipping an incomplete experience</text>
  </g>

  <!-- P5 -->
  <g>
    <text x="48" y="390" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#16140F">P5</text>
    <rect x="112" y="370" width="70" height="28" rx="6" fill="#B04A4A"/>
    <rect x="198" y="370" width="200" height="28" rx="6" fill="#B04A4A"/>
    <text x="240" y="389" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F4EFE6">AUTHENTICITY</text>
    <text x="420" y="389" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#16140F">fake data, claims, or evidence</text>
  </g>

  <!-- P6 -->
  <g>
    <text x="48" y="438" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#16140F">P6</text>
    <rect x="112" y="418" width="56" height="28" rx="6" fill="#2A2620"/>
    <rect x="184" y="418" width="190" height="28" rx="6" fill="#2A2620"/>
    <text x="226" y="437" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F4EFE6">CODE</text>
    <text x="396" y="437" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#16140F">sloppy implementation of the design</text>
  </g>

  <text x="48" y="510" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5A5648">Weight P0 &gt; P1 &gt; P4 &gt; P5 &gt; P6 &gt; P2 &gt; P3 — a single P0 is a fail.</text>
</svg>
